<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>射手榜</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="nav"></div>
  <main>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h2 style="margin:0">射手榜</h2>
        <div>
          <label style="display:inline;margin-right:6px">赛季</label>
          <input id="season-input" style="width:160px;display:inline-block" placeholder="如 2025-2026,留空看全部" />
          <button class="btn" onclick="load()">查询</button>
        </div>
      </div>
      <table id="scorer-table">
        <thead><tr><th>排名</th><th>球员</th><th>球队</th><th>进球</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </main>
  <script src="/js/api.js?v=3"></script>
  <script src="/js/scorers.js"></script>
</body>
</html>
