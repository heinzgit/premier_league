<!DOCTYPE html>

</head>
<body>

  <main>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center">

        <button class="btn" onclick="openCreateModal()">+ 新增比赛</button>

        <thead>

          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <div id="modal-host"></div>

  <script src="/js/api.js?v=3"></script>
  <script src="/js/matches.js?v=2"></script>
</body>
</html>
