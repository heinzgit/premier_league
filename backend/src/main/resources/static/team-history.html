<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>球队历史</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="nav"></div>
  <main>
    <div class="card">
      <h2>球队历史战绩</h2>
      <div style="margin-bottom:16px">
        <label>选择球队</label>
        <select id="team-select" style="max-width:300px"></select>
        <button class="btn" onclick="load()">查询</button>
      </div>
      <div id="summary"></div>
      <table id="history-table">
        <thead><tr><th>日期</th><th>赛季</th><th>对手</th><th>主/客</th><th>比分</th><th>结果</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/team-history.js"></script>
</body>
</html>
